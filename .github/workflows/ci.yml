name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build app
        run: npm run build
        env:
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Build extension
        run: npm run build:extension
        env:
          VITE_MIRU_URL: ${{ secrets.VITE_MIRU_URL }}

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension
          path: extension/dist/

  release-dev:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: extension/dist/

      - name: Zip extension
        run: cd extension/dist && zip -r ../../miru-extension-dev.zip .

      - name: Create or update dev release
        run: |
          gh release delete dev --repo ${{ github.repository }} --yes 2>/dev/null || true
          gh release create dev miru-extension-dev.zip \
            --repo ${{ github.repository }} \
            --title "Dev build" \
            --notes "Latest build from \`main\`. Updated on every merge." \
            --prerelease \
            --target main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-extension:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: extension/dist/

      - name: Set version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Zip extension
        run: cd extension/dist && zip -r ../../miru-extension-${{ steps.version.outputs.tag }}.zip .

      - name: Create GitHub Release
        run: |
          gh release create ${{ steps.version.outputs.tag }} \
            miru-extension-${{ steps.version.outputs.tag }}.zip \
            --repo ${{ github.repository }} \
            --title "Miru ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --prerelease=${{ contains(steps.version.outputs.tag, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Chrome Web Store
        run: |
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source miru-extension-${{ steps.version.outputs.tag }}.zip \
            --extension-id ${{ secrets.CHROME_EXTENSION_ID }} \
            --client-id ${{ secrets.CHROME_CLIENT_ID }} \
            --client-secret ${{ secrets.CHROME_CLIENT_SECRET }} \
            --refresh-token ${{ secrets.CHROME_REFRESH_TOKEN }} \
            --auto-publish

      - name: Publish to Firefox Add-ons
        run: |
          npx --yes web-ext sign \
            --source-dir extension/dist \
            --api-key ${{ secrets.FIREFOX_JWT_ISSUER }} \
            --api-secret ${{ secrets.FIREFOX_JWT_SECRET }} \
            --channel listed
